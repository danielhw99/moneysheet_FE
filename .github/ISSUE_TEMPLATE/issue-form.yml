name: Frontend Issue
description: MoneySheet Frontend 작업 이슈 템플릿
title: "[feat] "
labels:
  - needs-triage
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Prefix
      description: 작업 유형을 선택하세요.
      options:
        - feat
        - fix
        - refactor
        - chore
        - docs
        - test
        - style
        - del
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: 예) ledger, daily-sheet, budget, report, ui
      placeholder: daily-sheet
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 작업 목적을 간단히 작성하세요.
      placeholder: 어떤 화면/동작을 왜 바꾸는지 작성
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 해야 할 일을 체크리스트로 작성하세요.
      placeholder: |
        - [ ] 화면 수정
        - [ ] 상태 연결
        - [ ] 반응형 확인
    validations:
      required: true

  - type: textarea
    id: done_definition
    attributes:
      label: Definition of Done
      description: 완료 조건을 작성하세요.
      placeholder: 빌드 통과, 주요 화면 확인, 반응형 점검
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: References
      description: 관련 문서, 피그마, 화면, API 링크가 있으면 적어주세요.
      placeholder: docs/... , figma 링크 등
